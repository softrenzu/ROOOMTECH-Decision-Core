name: performance-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/performance-smoke.yml"

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Start API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/rtdc-uvicorn.log 2>&1 &
          echo $! > /tmp/rtdc-uvicorn.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rtdc-uvicorn.log
          exit 1
      - name: Create rules fast profile
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/v1/realtime/profiles \
            -H 'content-type: application/json' \
            -d '{"profile_id":"perf-route","kind":"route","target_ms":150,"request":{"provider":"rules","min_confidence":0.5,"routes":[{"id":"billing","keywords":["請求","invoice"]},{"id":"account","keywords":["ログイン","password"]}]}}' \
            | tee fast-profile.json
      - name: Measure HTTP realtime fast path
        run: |
          python benchmarks/http_realtime_load.py \
            --base-url http://127.0.0.1:8000 \
            --profile-id perf-route \
            --input 'ログインできません。パスワードを変更したいです' \
            --requests 5000 \
            --concurrency 64 \
            | tee realtime-http.json
      - name: Measure 10k-item MapReduce
        run: |
          python - <<'PY' | tee mapreduce-load.json
          import json, httpx
          items = [{"text": "返金をお願いします" if i % 4 == 0 else "配送状況を確認したいです"} for i in range(10000)]
          payload = {
              "request": {
                  "items": items,
                  "map": {
                      "kind": "detect",
                      "input_field": "text",
                      "config": {
                          "property": "refund request",
                          "provider": "rules",
                          "threshold": 0.8,
                          "keywords": ["返金"]
                      }
                  },
                  "reduce": {"kind": "count_by", "path": "detected"},
                  "concurrency": 64,
                  "include_map_results": False
              },
              "repeat_runs": 3,
              "warmup_runs": 0
          }
          response = httpx.post("http://127.0.0.1:8000/v1/benchmarks/mapreduce-load", json=payload, timeout=120.0)
          response.raise_for_status()
          print(json.dumps(response.json(), ensure_ascii=False, indent=2))
          PY
      - name: Upload measured results
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke
          path: |
            fast-profile.json
            realtime-http.json
            mapreduce-load.json
