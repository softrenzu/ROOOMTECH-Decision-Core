[project]
name = "rooomtech-decision-core"
version = "0.16.0"
description = "Independent multimodal decision platform with governed decision graphs, website changes, tenant isolation, guardrails and realtime inference"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "cryptography>=43,<47",
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
ml = ["torch>=2.4,<3"]
multimodal = [
  "torch>=2.4,<3",
  "pillow>=10,<12",
  "pymupdf>=1.24,<2",
  "transformers>=4.45,<5",
  "faster-whisper>=1.1,<2"
]
distributed = ["redis>=5,<7"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
