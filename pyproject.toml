[project]
name = "rooomtech-decision-core"
version = "0.5.0"
description = "Independent multimodal structured-decision API with reusable detection, routing, scoring, verification and ranking primitives"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "cryptography>=43,<47"
]

[project.optional-dependencies]
ml = ["torch>=2.4,<3"]
multimodal = [
  "torch>=2.4,<3",
  "pillow>=10,<12",
  "pymupdf>=1.24,<2",
  "transformers>=4.45,<5",
  "faster-whisper>=1.1,<2"
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
